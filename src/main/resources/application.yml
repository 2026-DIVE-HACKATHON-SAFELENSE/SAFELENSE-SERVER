server:
  forward-headers-strategy: framework

logging:
  level:
    org.hibernate.orm.connections.pooling: WARN
    org.flywaydb.core.FlywayExecutor: WARN

spring:
  application:
    name: safelense
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    validate-on-migrate: true
    validate-migration-naming: true

app:
  openai:
    api-key: ${OPENAI_API_KEY:}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    base-url: https://api.openai.com/v1
  upstage:
    api-key: ${UPSTAGE_API_KEY:}
    model: ${UPSTAGE_MODEL:solar-pro3}
    base-url: https://api.upstage.ai/v1
  public-data:
    service-key: ${PUBLIC_DATA_SERVICE_KEY:}
    building-base-url: https://apis.data.go.kr/1613000/BldRgstHubService
    apartment-rent-base-url: https://apis.data.go.kr/1613000/RTMSDataSvcAptRent
    officetel-rent-base-url: https://apis.data.go.kr/1613000/RTMSDataSvcOffiRent
    detached-rent-base-url: https://apis.data.go.kr/1613000/RTMSDataSvcSHRent
  vworld:
    api-key: ${VWORLD_API_KEY:}
    search-base-url: https://api.vworld.kr/req/search
    official-price-base-url: https://api.vworld.kr/ned/data/getApartHousingPriceAttr
  cors:
    allowed-origins:
      - http://localhost:8081
      - https://safelense-fe.pages.dev
      - https://safelense.site
  registry-document:
    bucket: ${REGISTRY_DOCUMENT_BUCKET:}
    kms-key-id: ${REGISTRY_DOCUMENT_KMS_KEY_ID:}
    region: ${AWS_REGION:ap-northeast-2}
    retention: P30D

auth:
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET}
  jwt:
    signing-secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT30M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P14D}
