server:
  forward-headers-strategy: framework

logging:
  level:
    org.hibernate.orm.connections.pooling: WARN
    org.flywaydb.core.FlywayExecutor: WARN

spring:
  application:
    name: safelense
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    validate-on-migrate: true
    validate-migration-naming: true

app:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.6}
    base-url: https://api.openai.com/v1
  cors:
    allowed-origins:
      - http://localhost:8081
      - https://safelense-fe.pages.dev
      - https://safelense.site
  registry-document:
    bucket: ${REGISTRY_DOCUMENT_BUCKET:}
    kms-key-id: ${REGISTRY_DOCUMENT_KMS_KEY_ID:}
    region: ${AWS_REGION:ap-northeast-2}
    retention: P30D

auth:
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET}
  jwt:
    signing-secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT30M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P14D}
